name: Maven CI

on:
  workflow_call:
    inputs:
      java-version:
        description: Temurin Java version
        type: string
        default: '25'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
